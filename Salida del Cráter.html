<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salida del Cráter</title>
<style>
:root{--bg:#1a0a14;--ink:#ffd9a8;--acc:#ff7a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;height:100%;aspect-ratio:480/720;max-width:100%}
canvas{width:100%;height:100%;display:block;background:#2a0f1e;image-rendering:pixelated}
#touch{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:space-between;padding:0 10px;pointer-events:none}
#touch button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #ff7a3d99;background:#2a0f1ecc;color:var(--ink);font-size:26px;touch-action:none}
#touch .mid{width:84px;height:84px;background:#ff7a3d55}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="480" height="720"></canvas>
<div id="touch"><button data-k="l">◀</button><button data-k="up" class="mid">▲</button><button data-k="r">▶</button></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=480,H=720,PX=20,RIM=160,G=60,TH=200,DRAG=1.2,MAXF=100,HH=28,HW=17,CX=W/2;
ctx.imageSmoothingEnabled=false;
const img=new Image();img.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAF0AAABwCAYAAAB8Q3wrAAAMq0lEQVR42u2da3BV1RXH/+fmQRIIEAJ5YEJI0iQEEt6XQEGgWnkoaqUzdTptnToqOq3tQNWxj1Sg41R8VLTTOmNbS4v90GKnD0ULWkcQKCGBBCKShEggJJIACW/yuvfm9sPai9y97zn3nouEnMBeX27OPvusvfc6v7P22o9zYvj9fjhFoo1RppXx+s8Y11NHf4sLWq4/XE4ifOGSO0OeD0XrtdChSdekX19JycgAAJxqbrblryPRoX26Jt05hFsdP1n6DADgpWd/YZkWTocmXZM+8DItrxAAkJySDACoPXgkYh0ZI9IBABOKcgEA7afaAQCbNOk3t2ija6NroztOli9dguVLl4RN00bXoo2uja6NrkUbXRtdyw07DcBiwHCEDk26Jr2fSXcZjtChSdekX6PCxfIbL0TEjhwGAHh/x8cAgJbaFin/P/6zJUiHmlaxpxIA0Hyeri1xuxFYhhMWqDXpN7tPZ/RUwln8NtMCdRhu7dO1ODV6cc+eSv65bD8A4Anhj40QTwfnKd9WJenQ0YsW55LOhHu6yWMPiY6xzBurnONrWEdG3jhNuhaHkf7R5g8BAKNuoXj9ZMNFAEDXRS8A4OVfrQ265pdrfg4A+NETq6V01sE6C6bka9JvZjEG4qUAHhXOdi8DAIxJIypdCYZEOEtZxWYAwMixaZY6z51oRaBOltScRABAbwe183TrJUnnQIxMNek3u0/fu50ijszMXInGSISvYeJZ53T3FO3TNekDLOxnWcZNGSuoRVhfzsJ52LezjqamI6ZlaNI16eaRhh252khgREqMoFJOH5dDsfXW996xrWvxnXeHLOP8Kc8XiriuhR006U4ine9s6lh6fWRIXIKlkraT5EejjEQ/APj8Fw07tKiRhirvb3mXzi+81X70sm0HAOCZF16U0plwNSIKt5LEbRo6lF5UGJ1q3b90d3XY0qlJ1x2p7kgBAIvmfwcAUFg0AQCQl5MNAKhvOHolz7/f3kiPbvmWkK7qkR+ulNJ//+tXQnakE/LzbIeM6jXfeHiFaUfK8oOnfwwA6OrssuUSiifRut+99zxwJU21Rc3BWgDAm399TpM+6EjfvXsbAKCupsEyT8NxutMGYq6qEi3HzvZ7Q6+2DG7TkXpq47/ees8y75lzx7VPH7Skz5mzEABQMLEAAJCfO57IP9JH/ubNbRQ6ljdEPJAAgPTxSQCA9vaT/dZQLqP6U5Hg80U0CMrNI/+9bNniK2kFuTkAgMNHjpFNDtUBAD5r3K1JHzSkJwwdLt+dKPErNmb2+nstlfLwneV4w2EpWlGjmHD+liex7CxiROrTuU7h6s4S2G62BdvGynaa9MHg01Xp7RUuL2CZr/0kDX+Xf/NbUl5fL1ER60sO6euSRg+XfHrtbqJr8qSFwg9vs0Vz4DWsQy2Dxd8ru+4vZc0BAExyU58V5SIeZ5ZQfF79v4agdvf2Xt1SpybdCaQPHzbe/Pb5DcmPvbnhj1dOTZmbJyDwKU8FkZ6cmiBID10Zn48mpRJHxgEAps8pjrhBC5YSmZW7PwEAnLI5lct15Doz6WobA9u9bt06yTZWtrxw6ZihSXcK6XxX3DPJJ1bs3SaDLvj/WelPicL5+QHn/Kahb0w0qY+OkUeqWdnj5SfCR9fnFRSa07tstv0WiUq4jBhJJ5fBkpYpf/GI68h1DvLDAs/AdrMtHvjuCtNr2JYq8Zr0gSS9p5tm24anxAMAMtNkf7rxT78DABSV0PYIw4gKgIu2vUVFRQm/KBcyNjuF/thFP41Hj0nxuhorz51LX7XYX0azdlPnTrLdIL6m10++fNcueeaTy+Q6qHVU686Ec3p0dF+72RZsm1nu+ZLt2JZsW+3TB1CMIdGp/kC60rJGEzG76qSMfFfj44cAADweX0C const docks=[{m:30,side:-1,n:1},{m:75,side:1,n:2},{m:120,side:-1,n:3}];
const K={};
const hw=m=>{const b=160+35*Math.sin(m*.11)+15*Math.sin(m*.37+1);const t=Math.min(1,Math.max(0,(m-(RIM-14))/14));return b+t*t*(3-2*t)*(330-b)};
const dockRect=d=>{const e=hw(d.m);return d.side<0?[CX-e,CX-e+110]:[CX+e-110,CX+e]};
const kmap={ArrowUp:'up',KeyW:'up',Space:'up',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{if(kmap[e.code]){K[kmap[e.code]]=true;e.preventDefault()}if((e.code==='KeyR'||e.code==='Enter')&&s.state!=='play')reset()});
addEventListener('keyup',e=>{if(kmap[e.code])K[kmap[e.code]]=false});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{K[k]=true;if(s.state!=='play')reset();e.preventDefault()});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>K[k]=false));
});
let s;
function reset(){s={x:CX,y:HH,vx:0,vy:0,fuel:MAXF,th:0,landed:'Estación',state:'play',cam:0,t:0,msg:'Mantén ▲ para encender motores',msgT:4,parts:[],reason:''}}
reset();
const say=(m,t=2.5)=>{s.msg=m;s.msgT=t};
function crash(why){
  s.state='crashed';s.reason=why;
  for(let i=0;i<40;i++){const a=Math.random()*6.28,v=40+Math.random()*160;s.parts.push({x:s.x,y:s.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v+40,l:1})}
}
function land(top,name){
  if(-s.vy<=75&&Math.abs(s.vx)<=70){s.y=top+HH;s.vx=s.vy=0;s.landed=name;s.th=0;say(name==='Estación'?'En la estación. Combustible recargando':'Atracado en '+name+'. Recargando…')}
  else crash('Aterrizaje demasiado brusco');
}
function update(dt){
  s.t+=dt;if(s.msgT>0)s.msgT-=dt;
  s.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=200*dt;p.l-=dt*.8});
  s.parts=s.parts.filter(p=>p.l>0);
  if(s.state!=='play')return;
  const up=K.up,l=K.l,r=K.r,fuel=s.fuel>0;
  s.th+=((up&&fuel)?1.2:-3.5)*dt;s.th=Math.min(1,Math.max(0,s.th));
  if(s.th>0&&fuel)s.fuel=Math.max(0,s.fuel-8*s.th*dt);
  if(s.landed){
    if(TH*s.th>G){s.landed=null;say('¡Despegue!',1.5)}
    else{s.vx=s.vy=0;s.fuel=Math.min(MAXF,s.fuel+25*dt);return}
  }
  const ax=((r?1:0)-(l?1:0))*(s.fuel>0?260:0);
  if((l||r)&&s.fuel>0)s.fuel=Math.max(0,s.fuel-1.5*dt);
  s.vx+=ax*dt;s.vx*=1-1.6*dt;
  s.vy+=(TH*s.th-G)*dt;s.vy*=1-DRAG*dt;
  const py=s.y;
  s.x+=s.vx*dt;s.y+=s.vy*dt;
  if(s.fuel<=0&&!s.warned){say('¡Sin combustible! Desciende hasta un puerto',3);s.warned=true}
  if(s.fuel>5)s.warned=false;
  // paredes
  const m0=(s.y-HH)/PX,m1=s.y/PX,m2=(s.y+HH)/PX;
  for(const m of[m0,m1,m2]){const e=hw(m);if(s.x-HW<CX-e||s.x+HW>CX+e){crash('Chocaste con la pared del cráter');return}}
  // puertos
  for(const d of docks){
    const top=d.m*PX,[x0,x1]=dockRect(d);
    if(s.vy<=0&&py-HH>=top-1&&s.y-HH<=top&&s.x>x0-6&&s.x<x1+6){land(top,'Puerto '+d.n);return}
  }
  if(s.y-HH<=0){land(0,'Estación');return}
  if(s.y>=(RIM+6)*PX)s.state='won';
}
const sy=wy=>H-120-(wy-s.cam);
const moons=[[70,70,34,'#e4693a'],[430,50,14,'#f08a4b'],[380,130,10,'#d9552f'],[60,190,16,'#f0a060'],[250,40,8,'#e4693a']];
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2b0d22');g.addColorStop(.6,'#5a1a2c');g.addColorStop(1,'#8a2a2a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const o=s.cam*.03;
  ctx.fillStyle='#f3d3a0';ctx.beginPath();ctx.arc(300,300+o,170,0,6.3);ctx.fill();
  ctx.strokeStyle='#e0a070';ctx.lineWidth=14;ctx.beginPath();ctx.arc(300,300+o,185,3.4,5.6);ctx.stroke();
  moons.forEach(([x,y,r,c])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y+o*1.5,r,0,6.3);ctx.fill()});
}
function drawWalls(){
  const lo=s.cam-190,hi=s.cam+700;
  const layers=[[46,'#3d1220'],[22,'#7a2a2f'],[0,'#b3432e']];
  for(const[off,col]of layers){
    for(const side of[-1,1]){
      ctx.fillStyle=col;ctx.beginPath();
      const ex=side<0?-20:W+20;
      ctx.moveTo(ex,sy(lo));
      for(let wy=lo;wy<=hi;wy+=10){const e=hw(wy/PX)+off;ctx.lineTo(CX+side*e,sy(wy))}
      ctx.lineTo(ex,sy(hi));ctx.closePath();ctx.fill();
    }
  }
  ctx.strokeStyle='#ff8a4a';ctx.lineWidth=3;
  for(const side of[-1,1]){ctx.beginPath();for(let wy=lo;wy<=hi;wy+=10){const e=hw(wy/PX);const x=CX+side*e,y=sy(wy);wy===lo?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
}
function drawStation(){
  const y0=sy(0);
  ctx.fillStyle='#8e2f26';ctx.fillRect(0,y0,W,H);
  ctx.fillStyle='#c4553a';ctx.fillRect(0,y0,W,6);
  // módulo colonia
  ctx.fillStyle='#5b1c2a';ctx.fillRect(40,y0-80,10,80);ctx.fillRect(150,y0-80,10,80);
  ctx.fillStyle='#d9663a';ctx.beginPath();ctx.moveTo(24,y0-100);ctx.lineTo(60,y0-122);ctx.lineTo(150,y0-122);ctx.lineTo(186,y0-100);ctx.lineTo(150,y0-78);ctx.lineTo(60,y0-78);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7a2230';ctx.fillRect(70,y0-112,70,12);
  ctx.fillStyle='#ffd9a8';for(let i=0;i<5;i++)ctx.fillRect(76+i*13,y0-109,8,6);
  ctx.fillStyle='#e8a070';ctx.fillRect(98,y0-160,6,40);ctx.fillRect(112,y0-148,6,28);
  ctx.fillStyle=(s.t*2|0)%2?'#ff4040':'#702020';ctx.fillRect(97,y0-166,8,6);
  // plataforma de despegue
  ctx.fillStyle='#3a1520';ctx.fillRect(CX-40,y0-3,80,6);
  ctx.fillStyle='#ffcf5a';ctx.fillRect(CX-40,y0-3,8,3);ctx.fillRect(CX+32,y0-3,8,3);
  ctx.fillStyle='#ffd9a8';ctx.font='11px Verdana';ctx.textAlign='center';ctx.fillText('ESTACIÓN',CX,y0+22);
}
function drawDocks(){
  for(const d of docks){
    const top=sy(d.m*PX),[x0,x1]=dockRect(d);
    if(top<-40||top>H+40)continue;
    const wallX=d.side<0?x0-30:x1;
    ctx.fillStyle='#4a1a28';ctx.fillRect(wallX,top,30,16);
    ctx.fillStyle='#e8a070';ctx.fillRect(x0,top,x1-x0,6);
    ctx.fillStyle='#7a2230';ctx.fillRect(x0,top+6,x1-x0,8);
    const on=(s.t*2|0)%2;
    ctx.fillStyle=on?'#ffcf5a':'#8a5a2a';ctx.fillRect(x0+2,top-3,6,3);ctx.fillRect(x1-8,top-3,6,3);
    // surtidor
    const px=d.side<0?x0+12:x1-24;
    ctx.fillStyle='#4ad0a0';ctx.fillRect(px,top-26,12,26);ctx.fillStyle='#103a30';ctx.fillRect(px+2,top-22,8,8);
    ctx.fillStyle='#ffd9a8';ctx.font='bold 11px Verdana';ctx.textAlign='center';
    ctx.fillText('PUERTO '+d.n+' · '+d.m+' m',(x0+x1)/2+(d.side<0?8:-8),top+28);
  }
}
function drawRim(){
  const y=sy(RIM*PX);if(y<-60||y>H+60)return;
  ctx.fillStyle='#ffd9a8';ctx.font='bold 14px Verdana';ctx.textAlign='center';
  ctx.fillText('BORDE DEL CRÁTER · '+RIM+' m',CX,y-8);
  ctx.strokeStyle='#ffd9a8';ctx.setLineDash([10,8]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.setLineDash([]);
}
function drawShip(){
  if(s.state==='crashed')return;
  const x=s.x,y=sy(s.y);
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.max(-.3,Math.min(.3,s.vx*.002)));
  if(s.th>.05&&s.fuel>0){
    const L=10+s.th*26*(.7+Math.random()*.5);
    for(const dx of[-8,8]){
      ctx.fillStyle='#ff9a2a';ctx.fillRect(dx-3,HH-6,6,L);
      ctx.fillStyle='#fff3b0';ctx.fillRect(dx-1,HH-6,2,L*.55);
    }
  }
  const h=HH*2,w=h*img.width/(img.height||1);
  if(img.complete&&img.width)ctx.drawImage(img,-w/2,-HH,w,h);
  else{ctx.fillStyle='#778';ctx.fillRect(-HW,-HH,HW*2,h)}
  ctx.restore();
}
function drawHUD(){
  const alt=Math.max(0,Math.round((s.y-HH)/PX*10)/10);
  ctx.fillStyle='#1a0a14cc';ctx.fillRect(8,8,170,86);
  ctx.textAlign='left';ctx.fillStyle='#ffd9a8';ctx.font='bold 15px Verdana';
  ctx.fillText('Altura '+alt.toFixed(1)+' m',18,30);
  ctx.font='12px Verdana';ctx.fillText('Velocidad '+Math.round(-s.vy/PX*10)/10+' m/s',18,48);
  const nd=docks.find(d=>d.m*PX>s.y-HH+4);
  ctx.fillText(nd?'Próximo puerto: '+(nd.m-alt).toFixed(0)+' m':'Siguiente: el borde ('+Math.max(0,RIM-alt).toFixed(0)+' m)',18,66);
  ctx.fillStyle='#3a1520';ctx.fillRect(18,74,150,10);
  const f=s.fuel/MAXF;ctx.fillStyle=f>.3?'#4ad0a0':'#ff4a3a';ctx.fillRect(18,74,150*f,10);
  ctx.fillStyle='#ffd9a8';ctx.font='10px Verdana';ctx.fillText('COMBUSTIBLE',22,82);
  if(s.msgT>0&&s.state==='play'){ctx.textAlign='center';ctx.font='bold 15px Verdana';ctx.fillStyle='#1a0a14cc';const tw=ctx.measureText(s.msg).width+24;ctx.fillRect(CX-tw/2,H-190,tw,30);ctx.fillStyle='#ffd9a8';ctx.fillText(s.msg,CX,H-170)}
}
function overlay(t1,t2){
  ctx.fillStyle='#1a0a14dd';ctx.fillRect(0,H/2-90,W,160);
  ctx.textAlign='center';ctx.fillStyle='#ff7a3d';ctx.font='bold 30px Verdana';ctx.fillText(t1,CX,H/2-35);
  ctx.fillStyle='#ffd9a8';ctx.font='15px Verdana';ctx.fillText(t2,CX,H/2);
  ctx.fillText('Pulsa R o Enter para reintentar',CX,H/2+40);
}
function draw(){
  const tgt=Math.max(0,s.y-300);s.cam+=(tgt-s.cam)*.12;
  drawSky();drawWalls();drawStation();drawDocks();drawRim();drawShip();
  s.parts.forEach(p=>{ctx.fillStyle=Math.random()<.5?'#ff9a2a':'#ffd9a8';ctx.fillRect(p.x,sy(p.y),4,4)});
  drawHUD();
  if(s.state==='crashed')overlay('Nave destruida',s.reason);
  if(s.state==='won')overlay('¡Saliste del cráter!','Te quedaba '+Math.round(s.fuel)+'% de combustible');
}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
